<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PSABE-PPG Management System</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background-effects"></div>


    <!-- =====================================================
         MAIN PAGE
    ====================================================== -->

    <main class="page">


        <!-- =================================================
             BRANDING
        ================================================== -->

        <section class="branding">

            <!-- Main Logo -->

            <div class="logo-wrapper">

                <img
                    src="assets/psabe-ppg-logo.png"
                    alt="PSABE-PPG CSU Chapter"
                    class="main-logo"
                >

            </div>


            <!-- Organization -->

            <h1 class="organization-name">
                PSABE-PPG
            </h1>


            <!-- System -->

            <h2 class="system-name">
                MANAGEMENT SYSTEM
            </h2>


            <!-- Green divider -->

            <div class="title-line"></div>


            <!-- Organization description -->

            <p class="organization-description">

                Philippine Society of Agricultural and Biosystems Engineers
                <br>

                Pre-Professional Group
                <br>

                Caraga State University Chapter

            </p>

        </section>



        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <section class="login-card">


            <!-- =================================================
                 LOGIN HEADER
            ================================================== -->

            <div class="login-header">

                <h2>
                    Welcome back!
                </h2>

                <p>
                    Sign in to your account to continue
                    <br>
                    to the PSABE-PPG Management System.
                </p>

            </div>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                autocomplete="on"
            >


                <!-- =================================================
                     USERNAME
                ================================================== -->

                <div class="field">

                    <div class="input-box">


                        <!-- User icon -->

                        <div class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <circle
                                    cx="12"
                                    cy="7"
                                    r="4"
                                />

                                <path
                                    d="M4.5 21c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"
                                />

                            </svg>

                        </div>


                        <!-- Username -->

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Username or Email"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>



                <!-- =================================================
                     PASSWORD
                ================================================== -->

                <div class="field">

                    <div class="input-box">


                        <!-- Lock icon -->

                        <div class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="11"
                                    rx="2"
                                />

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3"
                                />

                                <circle
                                    cx="12"
                                    cy="15.5"
                                    r="1"
                                />

                            </svg>

                        </div>


                        <!-- Password -->

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >


                        <!-- Show password -->

                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-button"
                            aria-label="Show password"
                        >

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <path
                                    d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                />

                            </svg>

                        </button>

                    </div>

                </div>



                <!-- =================================================
                     POSITION
                ================================================== -->

                <div class="field">

                    <div class="input-box position-box">


                        <!-- Officer icon -->

                        <div class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <circle
                                    cx="9"
                                    cy="8"
                                    r="3"
                                />

                                <path
                                    d="M3.5 20c.5-3.5 2.5-5.5 5.5-5.5s5 2 5.5 5.5"
                                />

                                <circle
                                    cx="17"
                                    cy="9"
                                    r="2.5"
                                />

                                <path
                                    d="M15 14.5c3.5-.2 5.2 1.7 5.5 4.5"
                                />

                            </svg>

                        </div>


                        <!-- Position -->

                        <select
                            id="position"
                            name="position"
                            required
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Select your position
                            </option>

                            <option value="President">
                                President
                            </option>

                            <option value="Vice President">
                                Vice President
                            </option>

                            <option value="Secretary">
                                Secretary
                            </option>

                            <option value="Treasurer">
                                Treasurer
                            </option>

                            <option value="Auditor">
                                Auditor
                            </option>

                            <option value="PIO">
                                Public Information Officer
                            </option>

                            <option value="Events Head">
                                Events Head
                            </option>

                            <option value="Membership Head">
                                Membership Head
                            </option>

                            <option value="Academic Affairs Head">
                                Academic Affairs Head
                            </option>

                        </select>


                        <!-- Dropdown arrow -->

                        <div class="select-arrow">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >

                                <path
                                    d="M6 9l6 6 6-6"
                                />

                            </svg>

                        </div>

                    </div>

                </div>



                <!-- =================================================
                     REMEMBER / FORGOT
                ================================================== -->

                <div class="login-options">


                    <!-- Remember -->

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span class="custom-checkbox"></span>

                        <span class="remember-text">
                            Remember me
                        </span>

                    </label>


                    <!-- Forgot password -->

                    <button
                        type="button"
                        id="forgotPassword"
                        class="forgot-password"
                    >
                        Forgot password?
                    </button>

                </div>



                <!-- =================================================
                     SIGN IN
                ================================================== -->

                <button
                    type="submit"
                    class="signin-button"
                >

                    <span>
                        Sign In
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </button>



                <!-- =================================================
                     LOGIN MESSAGE
                ================================================== -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>



                <!-- =================================================
                     AUTHORIZED
                ================================================== -->

                <div class="authorized">

                    <span class="authorized-line"></span>

                    <span>
                        Authorized organization members only
                    </span>

                    <span class="authorized-line"></span>

                </div>

            </form>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           PASSWORD VISIBILITY
        ====================================================== */

        const password =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");


        togglePassword.addEventListener(
            "click",
            function () {

                if (password.type === "password") {

                    password.type = "text";

                    togglePassword.classList.add("active");

                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    password.type = "password";

                    togglePassword.classList.remove("active");

                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );



        /* =====================================================
           LOGIN FORM
        ====================================================== */

        const loginForm =
            document.getElementById("loginForm");

        const loginMessage =
            document.getElementById("loginMessage");


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const passwordValue =
                    document
                        .getElementById("password")
                        .value
                        .trim();


                const position =
                    document
                        .getElementById("position")
                        .value;


                if (
                    !username ||
                    !passwordValue ||
                    !position
                ) {

                    showMessage(
                        "Please complete all required fields.",
                        "error"
                    );

                    return;

                }


                /*
                 * TEMPORARY LOGIN RESPONSE
                 *
                 * This will later be replaced by the
                 * Google Apps Script authentication.
                 */

                showMessage(
                    "Connecting to the PSABE-PPG system...",
                    "success"
                );

            }
        );



        /* =====================================================
           FORGOT PASSWORD
        ====================================================== */

        document
            .getElementById("forgotPassword")
            .addEventListener(
                "click",
                function () {

                    showMessage(
                        "Please contact the PSABE-PPG administrator for account assistance.",
                        "information"
                    );

                }
            );



        /* =====================================================
           MESSAGE FUNCTION
        ====================================================== */

        function showMessage(
            message,
            type
        ) {

            loginMessage.textContent =
                message;

            loginMessage.className =
                "login-message " + type;

        }



        /* =====================================================
           REMEMBER ME
        ====================================================== */

        const rememberMe =
            document.getElementById("rememberMe");


        rememberMe.addEventListener(
            "change",
            function () {

                if (this.checked) {

                    localStorage.setItem(
                        "psabeRemember",
                        "true"
                    );

                } else {

                    localStorage.removeItem(
                        "psabeRemember"
                    );

                }

            }
        );


    </script>

</body>
</html>
