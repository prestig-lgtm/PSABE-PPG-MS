<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PSABE-PPG Management System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND IMAGE -->
    <div class="background"></div>


    <!-- PAGE CONTENT -->
    <main class="page">

        <!-- ==============================
             BRANDING
        =============================== -->

        <section class="branding">

            <img
                src="assets/psabe-ppg-logo.png"
                alt="PSABE-PPG Logo"
                class="logo"
            >

            <h1>PSABE-PPG</h1>

            <div class="chapter">
                CSU CHAPTER
            </div>

            <div class="title-line"></div>

            <div class="system-title">
                MANAGEMENT SYSTEM
            </div>

        </section>


        <!-- ==============================
             LOGIN CARD
        =============================== -->

        <section class="login-card">

            <div class="login-header">

                <h2>Welcome back!</h2>

                <p>
                    Sign in to your account to continue
                    <br>
                    to the management system.
                </p>

            </div>


            <form id="loginForm">


                <!-- USERNAME -->

                <div class="input-box">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="12"
                                cy="7"
                                r="4"
                            ></circle>

                            <path
                                d="M4.5 21c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"
                            ></path>

                        </svg>

                    </div>

                    <input
                        type="text"
                        id="username"
                        placeholder="Username or Email"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-box">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>

                            <circle
                                cx="12"
                                cy="15"
                                r="1"
                            ></circle>

                        </svg>

                    </div>


                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        id="togglePassword"
                        class="eye-button"
                        aria-label="Show password"
                    >

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            ></circle>

                        </svg>

                    </button>

                </div>


                <!-- POSITION -->

                <div class="input-box">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="9"
                                cy="8"
                                r="3"
                            ></circle>

                            <path
                                d="M3.5 20c.5-3.5 2.5-5.5 5.5-5.5s5 2 5.5 5.5"
                            ></path>

                            <circle
                                cx="17"
                                cy="9"
                                r="2.5"
                            ></circle>

                            <path
                                d="M15 14.5c3.5-.2 5.2 1.7 5.5 4.5"
                            ></path>

                        </svg>

                    </div>


                    <select
                        id="position"
                        required
                    >

                        <option
                            value=""
                            disabled
                            selected
                        >
                            Select your position
                        </option>

                        <option>President</option>

                        <option>
                            Vice President
                        </option>

                        <option>Secretary</option>

                        <option>Treasurer</option>

                        <option>Auditor</option>

                        <option>
                            Public Information Officer
                        </option>

                        <option>
                            Events Head
                        </option>

                        <option>
                            Membership Head
                        </option>

                        <option>
                            Academic Affairs Head
                        </option>

                    </select>


                    <span class="select-arrow">
                        ▾
                    </span>

                </div>


                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span class="custom-checkbox"></span>

                        <span>
                            Remember me
                        </span>

                    </label>


                    <button
                        type="button"
                        class="forgot-password"
                    >
                        Forgot password?
                    </button>

                </div>


                <!-- SIGN IN -->

                <button
                    type="submit"
                    class="signin-button"
                >

                    <span>
                        Sign In
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </button>


                <!-- LOGIN MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <!-- AUTHORIZED -->

                <div class="authorized">

                    <span class="line"></span>

                    <span>
                        Authorized organization members only
                    </span>

                    <span class="line"></span>

                </div>

            </form>

        </section>

    </main>


    <script>

        /* ==========================================
           SHOW / HIDE PASSWORD
        ========================================== */

        const password =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");


        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                } else {

                    password.type = "password";

                }

            }
        );


        /* ==========================================
           TEMPORARY LOGIN
        ========================================== */

        const loginForm =
            document.getElementById("loginForm");

        const loginMessage =
            document.getElementById("loginMessage");


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const passwordValue =
                    document
                        .getElementById("password")
                        .value
                        .trim();


                const position =
                    document
                        .getElementById("position")
                        .value;


                if (
                    !username ||
                    !passwordValue ||
                    !position
                ) {

                    loginMessage.textContent =
                        "Please complete all fields.";

                    loginMessage.className =
                        "login-message error";

                    return;

                }


                /*
                 * TEMPORARY TEST RESPONSE
                 *
                 * Authentication will later be
                 * connected to Google Apps Script
                 * and Google Sheets.
                 */

                loginMessage.textContent =
                    "Login successful.";

                loginMessage.className =
                    "login-message success";

            }
        );


        /* ==========================================
           REMEMBER ME
        ========================================== */

        document
            .getElementById("remember")
            .addEventListener(
                "change",
                function () {

                    if (this.checked) {

                        localStorage.setItem(
                            "rememberPSABE",
                            "true"
                        );

                    } else {

                        localStorage.removeItem(
                            "rememberPSABE"
                        );

                    }

                }
            );

    </script>

</body>
</html>
