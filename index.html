<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#002d23"
    >

    <meta
        name="description"
        content="PSABE-PPG CSU Chapter Management System"
    >

    <title>PSABE-PPG CSU Chapter Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         LOADING SCREEN
         ===================================================== -->

    <div id="loadingScreen">

        <div class="loading-content">

            <!-- LOGO -->
            <img
                src="assets/psabe-ppg-logo.png"
                alt="PSABE-PPG CSU Chapter Logo"
                class="loading-logo"
            >

            <!-- LINE BETWEEN LOGO AND TEXT -->
            <div class="loading-divider"></div>

            <!-- TEXT -->
            <div class="loading-text">

                <div class="loading-title">
                    PSABE-PPG
                </div>

                <div class="loading-subtitle">
                    CSU CHAPTER
                </div>

                <div class="loading-system">
                    MANAGEMENT SYSTEM
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         LOGIN PAGE
         ===================================================== -->

    <main class="login-page">

        <section class="login-container">

            <!-- LOGIN HEADER -->

            <div class="login-header">

                <h1>
                    Welcome back!
                </h1>

                <p>
                    Sign in to your account to continue
                    to the management system.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                class="login-form"
                autocomplete="on"
            >


                <!-- USERNAME -->

                <div class="input-group">

                    <span class="input-icon" aria-hidden="true">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
                        </svg>

                    </span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username or Email"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <span class="input-icon" aria-hidden="true">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="11"
                                rx="2"
                            ></rect>

                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>

                            <circle
                                cx="12"
                                cy="15"
                                r="1"
                            ></circle>
                        </svg>

                    </span>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >


                    <!-- PASSWORD VISIBILITY -->

                    <button
                        type="button"
                        id="passwordToggle"
                        class="password-toggle"
                        aria-label="Show password"
                    >

                        <svg
                            id="eyeIcon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    </button>

                </div>


                <!-- POSITION -->

                <div class="input-group position-group">

                    <span class="input-icon" aria-hidden="true">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <circle
                                cx="9"
                                cy="8"
                                r="3"
                            ></circle>

                            <path
                                d="M3 20c0-3.5 2.5-6 6-6s6 2.5 6 6"
                            ></path>

                            <circle
                                cx="17"
                                cy="9"
                                r="2.5"
                            ></circle>

                            <path
                                d="M16 14c3 0 5 2 5 5"
                            ></path>

                        </svg>

                    </span>


                    <select
                        id="position"
                        name="position"
                        required
                    >

                        <option value="" selected disabled>
                            Select your position
                        </option>

                        <option value="President">
                            President
                        </option>

                        <option value="Vice President">
                            Vice President
                        </option>

                        <option value="Secretary">
                            Secretary
                        </option>

                        <option value="Treasurer">
                            Treasurer
                        </option>

                        <option value="Auditor">
                            Auditor
                        </option>

                        <option value="Public Information Officer">
                            Public Information Officer
                        </option>

                        <option value="Events Head">
                            Events Head
                        </option>

                        <option value="Membership Head">
                            Membership Head
                        </option>

                        <option value="Academic Affairs Head">
                            Academic Affairs Head
                        </option>

                    </select>


                    <!-- CUSTOM ARROW -->

                    <span
                        class="select-arrow"
                        aria-hidden="true"
                    ></span>

                </div>


                <!-- OPTIONS -->

                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a
                        href="#"
                        id="forgotPassword"
                        class="forgot-password"
                    >
                        Forgot password?
                    </a>

                </div>


                <!-- SIGN IN -->

                <button
                    type="submit"
                    class="sign-in-button"
                    id="signInButton"
                >
                    Sign In
                </button>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                ></div>


                <!-- AUTHORIZED -->

                <div class="authorized-message">

                    <span>
                        Authorized organization members only
                    </span>

                </div>

            </form>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
