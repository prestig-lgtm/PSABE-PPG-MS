<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#002d24"
    >

    <title>PSABE-PPG CSU Chapter Management System</title>

    <link rel="preload" as="image" href="assets/management-background.png">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="loading-active">

    <div id="backgroundLayer" class="background-layer"></div>

    <div id="loadingScreen" class="loading-screen">
        <div id="loadingBrand" class="loading-brand">
            <div class="loading-logo-container">
                <img src="assets/psabe-ppg-logo.png"
                     alt="PSABE-PPG CSU Chapter"
                     class="loading-logo">
            </div>

            <div class="loading-divider"></div>

            <div class="loading-text">
                <div class="loading-title">PSABE-PPG</div>
                <div class="loading-chapter">CSU CHAPTER</div>
                <div class="loading-system">MANAGEMENT SYSTEM</div>
            </div>
        </div>
    </div>

    <main id="loginPage" class="login-page">
        <section class="login-card">

            <div class="login-header">
                <h1>Welcome back!</h1>
                <p>
                    Sign in to your account to continue<br>
                    to the management system.
                </p>
            </div>

            <form id="loginForm" class="login-form" autocomplete="on">

                <div class="input-group">
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="7" r="4"></circle>
                            <path d="M5 21c0-4 3-7 7-7s7 3 7 7"></path>
                        </svg>
                    </div>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username or Email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                            <circle cx="12" cy="15.5" r="1"></circle>
                        </svg>
                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Show password"
                    >
                        <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <div class="input-group position-group">
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="9" cy="8" r="3"></circle>
                            <path d="M3 20c0-3.5 2.5-6 6-6s6 2.5 6 6"></path>
                            <circle cx="17" cy="9" r="2.5"></circle>
                            <path d="M15 15c3 0 5 2 5 5"></path>
                        </svg>
                    </div>

                    <select id="position" name="position" required>
                        <option value="" selected disabled>Select your position</option>

                        <option value="President">President</option>

                        <option value="Vice President">Vice President</option>

                        <option value="Secretary">Secretary</option>

                        <option value="Associate Secretary">Associate Secretary</option>

                        <option value="Treasurer">Treasurer</option>

                        <option value="Associate Treasurer">Associate Treasurer</option>

                        <option value="Auditor">Auditor</option>

                        <option value="Business Manager">Business Manager</option>

                        <option value="PIO for Communications">PIO for Communications</option>

                        <option value="PIO for Graphics">PIO for Graphics</option>

                        <option value="PIO for Publications">PIO for Publications</option>

                        <option value="1st Year Representative">1st Year Representative</option>

                        <option value="2nd Year Representative">2nd Year Representative</option>

                        <option value="3rd Year Representative">3rd Year Representative</option>

                        <option value="4th Year Representative">4th Year Representative</option>

                        <option value="Committee Head">Committee Head</option>
                        <option value="Property Custodian">Property Custodian</option>
                    </select>

                    <div class="select-arrow">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 9l6 6 6-6"></path>
                        </svg>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-option">
                        <input type="checkbox" id="rememberMe">
                        <span class="custom-checkbox"></span>
                        <span class="remember-text">Remember me</span>
                    </label>

                    <button
                        type="button"
                        id="forgotPassword"
                        class="forgot-password"
                    >
                        Forgot password?
                    </button>
                </div>

                <button type="submit" class="sign-in-button">
                    <span>Sign In</span>
                </button>

                <div class="authorized-message">
                    <span class="authorized-line"></span>
                    <span>Authorized organization members only</span>
                    <span class="authorized-line"></span>
                </div>

                <div id="loginMessage" class="login-message"></div>

            </form>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const loadingScreen = document.getElementById("loadingScreen");
            const loadingBrand = document.getElementById("loadingBrand");
            const backgroundLayer = document.getElementById("backgroundLayer");
            const loginPage = document.getElementById("loginPage");
            const loginForm = document.getElementById("loginForm");
            const password = document.getElementById("password");
            const togglePassword = document.getElementById("togglePassword");
            const position = document.getElementById("position");
            const rememberMe = document.getElementById("rememberMe");
            const username = document.getElementById("username");
            const loginMessage = document.getElementById("loginMessage");
            const forgotPassword = document.getElementById("forgotPassword");

            const backgroundImage = new Image();
            backgroundImage.src = "assets/management-background.png";

            function startLoadingAnimation() {
                backgroundLayer.classList.add("background-loaded");

                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        loadingBrand.classList.add("brand-visible");
                    });
                });

                setTimeout(function () {
                    loadingScreen.classList.add("loading-hidden");

                    setTimeout(function () {
                        loadingScreen.style.display = "none";
                        document.body.classList.remove("loading-active");
                        loginPage.classList.add("login-visible");
                    }, 850);

                }, 2300);
            }

            if (backgroundImage.complete && backgroundImage.naturalWidth > 0) {
                startLoadingAnimation();
            } else {
                backgroundImage.onload = startLoadingAnimation;
                backgroundImage.onerror = startLoadingAnimation;
            }

            const savedUsername =
                localStorage.getItem("psabeRememberedUsername");

            const savedPosition =
                localStorage.getItem("psabeRememberedPosition");

            if (savedUsername) {
                username.value = savedUsername;
                rememberMe.checked = true;
            }

            if (savedPosition) {
                position.value = savedPosition;
            }

            togglePassword.addEventListener("click", function () {
                if (password.type === "password") {
                    password.type = "text";
                    togglePassword.setAttribute("aria-label", "Hide password");
                    togglePassword.classList.add("password-visible");
                } else {
                    password.type = "password";
                    togglePassword.setAttribute("aria-label", "Show password");
                    togglePassword.classList.remove("password-visible");
                }
            });

            forgotPassword.addEventListener("click", function () {
                showMessage(
                    "Please contact the PSABE-PPG system administrator to reset your password.",
                    "info"
                );
            });

            /* =====================================================
               SUPABASE AUTHENTICATION
            ===================================================== */

            const SUPABASE_URL =
                "https://dwzcyupoenjafgtdijla.supabase.co";

            const SUPABASE_PUBLISHABLE_KEY =
                "sb_publishable_s4VaYFDHxE3I9jgK2reWHw_zQ8VPVwd";

            const supabaseClient = window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

            loginForm.addEventListener("submit", async function (event) {

                event.preventDefault();

                const enteredUsername = username.value.trim();
                const enteredPassword = password.value;
                const selectedPosition = position.value;

                if (
                    !enteredUsername ||
                    !enteredPassword ||
                    !selectedPosition
                ) {
                    showMessage(
                        "Please complete all login fields.",
                        "error"
                    );
                    return;
                }

                const signInButton =
                    loginForm.querySelector(".sign-in-button");

                const originalButtonText =
                    signInButton
                        ? signInButton.innerHTML
                        : "";

                if (signInButton) {
                    signInButton.disabled = true;
                    signInButton.innerHTML =
                        "<span>Signing In...</span>";
                }

                try {

                    /* ================================================
                       CONVERT USERNAME TO INTERNAL SUPABASE EMAIL
                    ================================================= */

                    let authEmail = enteredUsername.trim().toLowerCase();

                    if (!authEmail.includes("@")) {
                        authEmail += "@psabeppg.local";
                    }


                    /* ================================================
                       SUPABASE AUTH LOGIN
                    ================================================= */

                    const {
                        data: authData,
                        error: authError
                    } =
                        await supabaseClient.auth.signInWithPassword({
                            email: authEmail,
                            password: enteredPassword
                        });


                    if (authError) {

                        console.error(
                            "Supabase login error:",
                            authError
                        );

                        showMessage(
                            "Incorrect username or password.",
                            "error"
                        );

                        return;
                    }


                    if (!authData || !authData.user) {

                        showMessage(
                            "Unable to verify your account.",
                            "error"
                        );

                        return;
                    }


                    /* ================================================
                       GET OFFICER PROFILE
                    ================================================= */

                    const {
                        data: officer,
                        error: officerError
                    } =
                        await supabaseClient
                            .from("officers")
                            .select(`
                                username,
                                name,
                                position,
                                status,
                                access_level,
                                auth_user_id
                            `)
                            .eq("auth_user_id", authData.user.id)
                            .single();


                    if (officerError || !officer) {

                        console.error(
                            "Officer profile error:",
                            officerError
                        );

                        await supabaseClient.auth.signOut();

                        showMessage(
                            "Your account is not properly linked to an officer record.",
                            "error"
                        );

                        return;
                    }


                    /* ================================================
                       VERIFY ACCOUNT STATUS
                    ================================================= */

                    if (
                        officer.status &&
                        officer.status.toLowerCase() !== "active"
                    ) {

                        await supabaseClient.auth.signOut();

                        showMessage(
                            "Your officer account is currently inactive.",
                            "error"
                        );

                        return;
                    }


                    /* ================================================
                       VERIFY SELECTED POSITION
                    ================================================= */

                    if (
                        officer.position &&
                        officer.position.trim().toLowerCase() !==
                        selectedPosition.trim().toLowerCase()
                    ) {

                        await supabaseClient.auth.signOut();

                        showMessage(
                            "The selected position does not match your officer account.",
                            "error"
                        );

                        return;
                    }


                    /* ================================================
                       REMEMBER ME
                    ================================================= */

                    if (rememberMe.checked) {

                        localStorage.setItem(
                            "psabeRememberedUsername",
                            officer.username
                        );

                        localStorage.setItem(
                            "psabeRememberedPosition",
                            officer.position || selectedPosition
                        );

                    } else {

                        localStorage.removeItem(
                            "psabeRememberedUsername"
                        );

                        localStorage.removeItem(
                            "psabeRememberedPosition"
                        );
                    }


                    /* ================================================
                       COMPATIBILITY SESSION DATA
                    ================================================= */

                    sessionStorage.setItem(
                        "psabeLoggedIn",
                        "true"
                    );

                    sessionStorage.setItem(
                        "psabeUsername",
                        officer.username
                    );

                    sessionStorage.setItem(
                        "psabeName",
                        officer.name || ""
                    );

                    sessionStorage.setItem(
                        "psabePosition",
                        officer.position || ""
                    );

                    sessionStorage.setItem(
                        "psabeStatus",
                        officer.status || ""
                    );

                    sessionStorage.setItem(
                        "psabeAccessLevel",
                        officer.access_level || "Officer"
                    );


                    /* ================================================
                       SUCCESS
                    ================================================= */

                    showMessage(
                        "Login successful. Opening management system...",
                        "success"
                    );


                    setTimeout(function () {

                        window.location.href =
                            "dashboard.html";

                    }, 900);


                } catch (error) {

                    console.error(
                        "Authentication error:",
                        error
                    );

                    showMessage(
                        "Unable to connect to the authentication server. Please try again.",
                        "error"
                    );

                } finally {

                    if (signInButton) {

                        signInButton.disabled = false;
                        signInButton.innerHTML =
                            originalButtonText;

                    }

                }
            });

            function showMessage(message, type) {
                loginMessage.textContent = message;
                loginMessage.className =
                    "login-message " + type;
            }
        });
    </script>

</body>
</html>
