<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#001c14"
    >

    <title>
        PSABE-PPG Management System
    </title>

    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
         STYLESHEET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         LOADING SCREEN

         This is the ONLY place where the PSABE-PPG
         logo and organization title are displayed.
    ====================================================== -->

    <div
        id="loadingScreen"
        class="loading-screen"
    >

        <div class="loading-content">


            <!-- LOGO -->

            <img
                src="assets/psabe-ppg-logo.png"
                alt="PSABE-PPG Logo"
                class="loading-logo"
            >


            <!-- ORGANIZATION -->

            <div class="loading-name">
                PSABE-PPG
            </div>


            <!-- CHAPTER -->

            <div class="loading-chapter">
                CSU CHAPTER
            </div>


            <!-- DIVIDER -->

            <div class="loading-divider"></div>


            <!-- SYSTEM -->

            <div class="loading-system">
                MANAGEMENT SYSTEM
            </div>


        </div>

    </div>



    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background"></div>



    <!-- =====================================================
         LOGIN PAGE
         
         IMPORTANT:
         There is NO PSABE logo or organization heading here.
         The branding exists only in the loading screen.
    ====================================================== -->

    <main class="page">


        <section class="login-card">


            <!-- =================================================
                 LOGIN HEADER
            ================================================== -->

            <div class="login-header">

                <h1>
                    Welcome back!
                </h1>

                <p>
                    Sign in to your account to continue
                    <br>
                    to the management system.
                </p>

            </div>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                autocomplete="on"
            >


                <!-- USERNAME -->

                <div class="input-box">

                    <div class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <circle
                                cx="12"
                                cy="8"
                                r="4"
                            ></circle>

                            <path
                                d="M4 21c0-4 3.2-7 8-7s8 3 8 7"
                            ></path>

                        </svg>

                    </div>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username or Email"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-box">

                    <div class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>

                            <circle
                                cx="12"
                                cy="15"
                                r="1"
                            ></circle>

                        </svg>

                    </div>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >


                    <!-- PASSWORD VISIBILITY -->

                    <button
                        type="button"
                        class="eye-button"
                        id="togglePassword"
                        aria-label="Show password"
                    >

                        <svg
                            id="eyeIcon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            ></circle>

                        </svg>

                    </button>

                </div>



                <!-- POSITION -->

                <div class="input-box">


                    <div class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <circle
                                cx="9"
                                cy="8"
                                r="3"
                            ></circle>

                            <path
                                d="M3 20c0-3.5 2.5-6 6-6s6 2.5 6 6"
                            ></path>

                            <circle
                                cx="17"
                                cy="9"
                                r="2.5"
                            ></circle>

                            <path
                                d="M16 14c2.8 0 5 2.2 5 5"
                            ></path>

                        </svg>

                    </div>


                    <select
                        id="position"
                        name="position"
                        required
                    >

                        <option
                            value=""
                            disabled
                            selected
                        >
                            Select your position
                        </option>

                        <option value="President">
                            President
                        </option>

                        <option value="Vice President">
                            Vice President
                        </option>

                        <option value="Secretary">
                            Secretary
                        </option>

                        <option value="Treasurer">
                            Treasurer
                        </option>

                        <option value="Auditor">
                            Auditor
                        </option>

                        <option value="PIO">
                            Public Information Officer
                        </option>

                        <option value="Events Head">
                            Events Head
                        </option>

                        <option value="Membership Head">
                            Membership Head
                        </option>

                        <option value="Academic Affairs Head">
                            Academic Affairs Head
                        </option>

                    </select>


                    <span class="select-arrow">
                        ⌄
                    </span>

                </div>



                <!-- =================================================
                     OPTIONS
                ================================================== -->

                <div class="login-options">


                    <!-- REMEMBER ME -->

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span class="custom-checkbox"></span>

                        <span>
                            Remember me
                        </span>

                    </label>



                    <!-- FORGOT PASSWORD -->

                    <button
                        type="button"
                        class="forgot-password"
                        id="forgotPassword"
                    >
                        Forgot password?
                    </button>


                </div>



                <!-- =================================================
                     SIGN IN
                ================================================== -->

                <button
                    type="submit"
                    class="signin-button"
                    id="signinButton"
                >

                    <span>
                        Sign In
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </button>



                <!-- LOGIN MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></div>



                <!-- AUTHORIZED -->

                <div class="authorized">

                    <span class="line"></span>

                    <span>
                        Authorized organization members only
                    </span>

                    <span class="line"></span>

                </div>


            </form>


        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =================================================
           LOADING SCREEN
        ================================================= */

        window.addEventListener(
            "load",
            function () {

                const loadingScreen =
                    document.getElementById(
                        "loadingScreen"
                    );


                /*
                 * Allow the complete branding animation
                 * to be seen before fading away.
                 */

                setTimeout(
                    function () {

                        loadingScreen.classList.add(
                            "loaded"
                        );

                    },
                    2800
                );

            }
        );



        /* =================================================
           PASSWORD VISIBILITY
        ================================================= */

        const passwordInput =
            document.getElementById(
                "password"
            );

        const togglePassword =
            document.getElementById(
                "togglePassword"
            );


        togglePassword.addEventListener(
            "click",
            function () {

                const isPassword =
                    passwordInput.type === "password";


                if (isPassword) {

                    passwordInput.type = "text";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    passwordInput.type = "password";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );



        /* =================================================
           REMEMBER ME
        ================================================= */

        const usernameInput =
            document.getElementById(
                "username"
            );

        const rememberMe =
            document.getElementById(
                "rememberMe"
            );


        /*
         * Load remembered username.
         */

        const savedUsername =
            localStorage.getItem(
                "psabeRememberedUsername"
            );


        if (savedUsername) {

            usernameInput.value =
                savedUsername;

            rememberMe.checked = true;

        }



        /* =================================================
           FORGOT PASSWORD
        ================================================= */

        const forgotPassword =
            document.getElementById(
                "forgotPassword"
            );

        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        forgotPassword.addEventListener(
            "click",
            function () {

                loginMessage.className =
                    "login-message";

                loginMessage.textContent =
                    "Please contact the PSABE-PPG administrator to reset your password.";

            }
        );



        /* =================================================
           TEMPORARY LOGIN
           
           THIS IS ONLY FOR FRONTEND TESTING.

           Username:
           admin

           Password:
           admin123
        ================================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const signinButton =
            document.getElementById(
                "signinButton"
            );


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const username =
                    usernameInput.value.trim();

                const password =
                    passwordInput.value;

                const position =
                    document.getElementById(
                        "position"
                    ).value;



                /* CLEAR MESSAGE */

                loginMessage.textContent = "";

                loginMessage.className =
                    "login-message";



                /* VALIDATION */

                if (
                    username === "" ||
                    password === "" ||
                    position === ""
                ) {

                    loginMessage.className =
                        "login-message error";

                    loginMessage.textContent =
                        "Please complete all required fields.";

                    return;

                }



                /* BUTTON STATE */

                signinButton.disabled = true;

                signinButton.innerHTML =
                    `
                    <span>
                        Signing in...
                    </span>

                    <span class="loading-spinner"></span>
                    `;



                /*
                 * TEMPORARY FRONTEND LOGIN
                 */

                setTimeout(
                    function () {


                        if (
                            username === "admin" &&
                            password === "admin123"
                        ) {


                            /* REMEMBER USERNAME */

                            if (
                                rememberMe.checked
                            ) {

                                localStorage.setItem(
                                    "psabeRememberedUsername",
                                    username
                                );

                            } else {

                                localStorage.removeItem(
                                    "psabeRememberedUsername"
                                );

                            }



                            /* SAVE CURRENT USER */

                            localStorage.setItem(
                                "psabeCurrentUser",
                                JSON.stringify({
                                    username:
                                        username,

                                    position:
                                        position
                                })
                            );



                            /*
                             * SUCCESS
                             */

                            loginMessage.className =
                                "login-message success";

                            loginMessage.textContent =
                                "Login successful. Loading management system...";



                            /*
                             * TEMPORARY REDIRECT
                             *
                             * Change this later to:
                             * dashboard.html
                             */

                            setTimeout(
                                function () {

                                    window.location.href =
                                        "dashboard.html";

                                },
                                800
                            );


                        } else {


                            /* LOGIN FAILED */

                            loginMessage.className =
                                "login-message error";

                            loginMessage.textContent =
                                "Invalid username or password.";


                            signinButton.disabled =
                                false;

                            signinButton.innerHTML =
                                `
                                <span>
                                    Sign In
                                </span>

                                <span class="arrow">
                                    →
                                </span>
                                `;

                        }

                    },
                    700
                );

            }
        );


    </script>


</body>

</html>
