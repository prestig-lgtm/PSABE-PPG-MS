<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PSABE-PPG CSU Chapter Management System
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            min-height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #071f18;
            color: #ffffff;

        }


        body {

            min-height: 100vh;
            overflow: hidden;

        }


        /* =====================================================
           LOGIN PAGE
        ====================================================== */

        .login-page {

            position: relative;

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

        }


        .login-page::before {

            content: "";

            position: absolute;
            inset: 0;

            background:

                linear-gradient(
                    90deg,
                    rgba(3, 27, 21, 0.90),
                    rgba(3, 27, 21, 0.55),
                    rgba(3, 27, 21, 0.78)
                ),

                url("assets/management-background.png")
                center center /
                cover no-repeat;

            z-index: 0;

        }


        /* =====================================================
           LOGIN CONTAINER
        ====================================================== */

        .login-container {

            position: relative;
            z-index: 2;

            width: min(430px, 90%);

            padding: 42px 38px;

            border:
                1px solid
                rgba(214, 180, 91, 0.35);

            border-radius: 20px;

            background:
                rgba(5, 35, 27, 0.68);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.35);

        }


        /* =====================================================
           BRAND
        ====================================================== */

        .brand {

            text-align: center;

            margin-bottom: 30px;

        }


        .brand img {

            width: 95px;
            height: 95px;

            object-fit: contain;

            margin-bottom: 14px;

        }


        .brand h1 {

            font-size: 22px;

            line-height: 1.25;

            font-weight: 700;

            color: #ffffff;

        }


        .brand p {

            margin-top: 7px;

            font-size: 12px;

            letter-spacing: 1.4px;

            color: #d6b45b;

            text-transform: uppercase;

        }


        /* =====================================================
           FORM
        ====================================================== */

        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.8px;

            color: #ffffff;

            text-transform: uppercase;

        }


        .form-group input,
        .form-group select {

            width: 100%;

            height: 48px;

            padding: 0 15px;

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            border-radius: 10px;

            outline: none;

            background:
                rgba(255, 255, 255, 0.08);

            color: #ffffff;

            font-size: 14px;

        }


        .form-group input::placeholder {

            color:
                rgba(255, 255, 255, 0.55);

        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #d6b45b;

            background:
                rgba(255, 255, 255, 0.11);

        }


        .form-group select option {

            background: #08261d;

            color: #ffffff;

        }


        /* =====================================================
           LOGIN BUTTON
        ====================================================== */

        .login-button {

            width: 100%;

            height: 50px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            background: #d6b45b;

            color: #08261d;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 0.5px;

            transition: 0.2s ease;

        }


        .login-button:hover {

            background: #e5c873;

            transform: translateY(-1px);

        }


        .login-button:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

        }


        /* =====================================================
           MESSAGE
        ====================================================== */

        .message {

            display: none;

            margin-top: 16px;

            padding: 11px 13px;

            border-radius: 8px;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;

        }


        .message.error {

            display: block;

            background:
                rgba(160, 30, 30, 0.25);

            border:
                1px solid
                rgba(255, 100, 100, 0.35);

            color: #ffd2d2;

        }


        .message.success {

            display: block;

            background:
                rgba(30, 130, 80, 0.25);

            border:
                1px solid
                rgba(100, 255, 170, 0.35);

            color: #d4ffe5;

        }


        /* =====================================================
           LOADING SCREEN
        ====================================================== */

        .loading-screen {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #061f18;

            transition:
                opacity 0.6s ease,
                visibility 0.6s ease;

        }


        .loading-screen.hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        .loading-content {

            text-align: center;

        }


        .loading-content img {

            width: 115px;
            height: 115px;

            object-fit: contain;

            animation:
                logoSpin
                2.5s
                linear
                infinite;

        }


        .loading-line {

            width: 150px;

            height: 1px;

            margin:
                20px
                auto
                16px;

            background: #d6b45b;

        }


        .loading-title {

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 1.5px;

            color: #ffffff;

        }


        .loading-subtitle {

            margin-top: 6px;

            font-size: 10px;

            letter-spacing: 1.3px;

            color: #d6b45b;

            text-transform: uppercase;

        }


        /* =====================================================
           LOGO ROTATION
        ====================================================== */

        @keyframes logoSpin {

            0% {

                transform:
                    perspective(500px)
                    rotateY(0deg);

            }

            50% {

                transform:
                    perspective(500px)
                    rotateY(180deg);

            }

            100% {

                transform:
                    perspective(500px)
                    rotateY(360deg);

            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 600px) {

            .login-container {

                width: 90%;

                padding:
                    32px
                    25px;

            }


            .brand img {

                width: 82px;
                height: 82px;

            }


            .brand h1 {

                font-size: 19px;

            }


            .login-page::before {

                background-position:
                    center center;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         LOADING SCREEN
    ====================================================== -->

    <div
        class="loading-screen"
        id="loadingScreen"
    >

        <div class="loading-content">


            <img
                src="assets/psabe-ppg-logo.png"
                alt="PSABE-PPG Logo"
            >


            <div class="loading-line"></div>


            <div class="loading-title">

                PSABE-PPG CSU CHAPTER

            </div>


            <div class="loading-subtitle">

                Management System

            </div>


        </div>

    </div>



    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <div class="login-page">


        <div class="login-container">


            <!-- BRAND -->

            <div class="brand">


                <img
                    src="assets/psabe-ppg-logo.png"
                    alt="PSABE-PPG Logo"
                >


                <h1>

                    PSABE-PPG CSU Chapter
                    Management System

                </h1>


                <p>

                    Officer Access

                </p>


            </div>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- USERNAME -->

                <div class="form-group">


                    <label for="username">

                        Username

                    </label>


                    <input
                        type="text"
                        id="username"
                        autocomplete="username"
                        placeholder="Enter your username"
                        required
                    >


                </div>



                <!-- PASSWORD -->

                <div class="form-group">


                    <label for="password">

                        Password

                    </label>


                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >


                </div>



                <!-- POSITION -->

                <div class="form-group">


                    <label for="position">

                        Position

                    </label>


                    <select
                        id="position"
                        required
                    >


                        <option
                            value=""
                            selected
                            disabled
                        >
                            Select your position
                        </option>


                        <option value="President">

                            President

                        </option>


                        <option value="Vice President">

                            Vice President

                        </option>


                        <option value="Secretary">

                            Secretary

                        </option>


                        <option value="Treasurer">

                            Treasurer

                        </option>


                        <option value="Auditor">

                            Auditor

                        </option>


                        <option value="PRO">

                            PRO

                        </option>


                        <option value="Committee Head">

                            Committee Head

                        </option>


                        <option value="Officer">

                            Officer

                        </option>


                    </select>


                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    LOG IN

                </button>



                <!-- MESSAGE -->

                <div
                    class="message"
                    id="loginMessage"
                ></div>


            </form>


        </div>


    </div>



    <script>


        /* =====================================================
           GOOGLE APPS SCRIPT WEB APP URL
        ====================================================== */

        const WEB_APP_URL =
            "https://script.google.com/macros/s/AKfycbzTZORNDMsHLxoPeOLNAHurKurC14whoFKxT10RVPyCxP-z9H03slRLTUyhVx7tkyMW/exec";



        /* =====================================================
           ELEMENTS
        ====================================================== */

        const loadingScreen =
            document.getElementById(
                "loadingScreen"
            );


        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );



        /* =====================================================
           LOADING SCREEN
        ====================================================== */

        window.addEventListener(
            "load",
            () => {

                setTimeout(
                    () => {

                        loadingScreen.classList.add(
                            "hidden"
                        );

                    },
                    1800
                );

            }
        );



        /* =====================================================
           MESSAGE
        ====================================================== */

        function showMessage(
            message,
            type
        ) {

            loginMessage.textContent =
                message;


            loginMessage.className =
                "message " + type;

        }



        /* =====================================================
           LOGIN
        ====================================================== */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();



                const enteredUsername =
                    document
                        .getElementById(
                            "username"
                        )
                        .value
                        .trim();


                const enteredPassword =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                const selectedPosition =
                    document
                        .getElementById(
                            "position"
                        )
                        .value;



                /* ---------------------------------------------
                   VALIDATION
                --------------------------------------------- */

                if (
                    !enteredUsername ||
                    !enteredPassword ||
                    !selectedPosition
                ) {

                    showMessage(
                        "Please complete all fields.",
                        "error"
                    );

                    return;

                }



                /* ---------------------------------------------
                   API CHECK
                --------------------------------------------- */

                if (
                    !WEB_APP_URL ||
                    WEB_APP_URL ===
                    "YOUR_GOOGLE_APPS_SCRIPT_EXEC_URL"
                ) {

                    showMessage(
                        "The Google Sheets login connection has not been configured yet.",
                        "error"
                    );

                    return;

                }



                /* ---------------------------------------------
                   LOGIN STATE
                --------------------------------------------- */

                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "LOGGING IN...";


                showMessage(
                    "",
                    ""
                );



                try {


                    /* -----------------------------------------
                       SEND LOGIN REQUEST
                    ----------------------------------------- */

                    const response =
                        await fetch(
                            WEB_APP_URL,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "text/plain;charset=utf-8"

                                },

                                body:
                                    JSON.stringify({

                                        action:
                                            "login",

                                        data: {

                                            username:
                                                enteredUsername,

                                            password:
                                                enteredPassword,

                                            position:
                                                selectedPosition

                                        }

                                    })

                            }
                        );



                    /* -----------------------------------------
                       READ RESPONSE
                    ----------------------------------------- */

                    const result =
                        await response.json();



                    if (
                        !result ||
                        !result.success
                    ) {

                        throw new Error(
                            result?.message ||
                            "Login failed."
                        );

                    }



                    const user =
                        result.user;



                    /* -----------------------------------------
                       SAVE SESSION
                    ----------------------------------------- */

                    sessionStorage.setItem(
                        "psabeLoggedIn",
                        "true"
                    );


                    sessionStorage.setItem(
                        "psabeUsername",
                        user.username || ""
                    );


                    sessionStorage.setItem(
                        "psabeName",
                        user.name || ""
                    );


                    sessionStorage.setItem(
                        "psabePosition",
                        user.position || ""
                    );


                    sessionStorage.setItem(
                        "psabeStatus",
                        user.status || "Active"
                    );


                    sessionStorage.setItem(
                        "psabeAccessLevel",
                        user.accessLevel || "Officer"
                    );



                    /* -----------------------------------------
                       SUCCESS
                    ----------------------------------------- */

                    showMessage(
                        "Login successful. Redirecting...",
                        "success"
                    );



                    setTimeout(
                        () => {

                            window.location.href =
                                "dashboard.html";

                        },
                        700
                    );


                } catch (error) {


                    console.error(
                        "Login error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Unable to connect to the server.",
                        "error"
                    );


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "LOG IN";


                }

            }
        );


    </script>


</body>

</html>
