<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#002d24"
    >

    <title>
        PSABE-PPG Management System
    </title>


    <!-- Roboto Condensed -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Existing login styling -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         BACKGROUND LOGO
    ====================================================== -->

    <div class="bg-logo"></div>



    <!-- =====================================================
         PAGE WRAPPER
    ====================================================== -->

    <div class="page-wrapper">


        <!-- =================================================
             BRANDING
        ================================================== -->

        <header class="branding">

            <img
                src="assets/psabe-ppg-logo.png"
                alt="PSABE-PPG Logo"
                class="header-logo"
            >


            <h1 class="org-name">
                PSABE-PPG
            </h1>


            <h2 class="system-name">
                MANAGEMENT SYSTEM
            </h2>


            <div class="title-line"></div>


            <p class="org-description">

                Philippine Society of Agricultural and Biosystems Engineers<br>

                Pre-Professional Group<br>

                Caraga State University Chapter

            </p>

        </header>



        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <section class="login-card">


            <div class="login-header">

                <h2>
                    Welcome back!
                </h2>

                <p>
                    Sign in to your account to continue<br>
                    to the PSABE-PPG Management System.
                </p>

            </div>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                autocomplete="on"
            >


                <!-- USERNAME -->

                <div class="field">

                    <div class="input-field">

                        <i class="icon user">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <circle
                                    cx="12"
                                    cy="7"
                                    r="4"
                                />

                                <path
                                    d="M4.5 21c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"
                                />

                            </svg>

                        </i>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Username or Email"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="field">

                    <div class="input-field">

                        <i class="icon lock">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="11"
                                    rx="2"
                                />

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3"
                                />

                                <circle
                                    cx="12"
                                    cy="15.5"
                                    r="1"
                                />

                            </svg>

                        </i>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <path
                                    d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                />

                            </svg>

                        </button>

                    </div>

                </div>



                <!-- POSITION -->

                <div class="field">

                    <div class="input-field position-box">

                        <i class="icon position">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <circle
                                    cx="9"
                                    cy="8"
                                    r="3"
                                />

                                <path
                                    d="M3.5 20c.5-3.5 2.5-5.5 5.5-5.5s5 2 5.5 5.5"
                                />

                                <path
                                    d="M15 11c2.8 0 5 1.8 5.5 5"
                                />

                                <circle
                                    cx="17"
                                    cy="7"
                                    r="2"
                                />

                            </svg>

                        </i>


                        <select
                            id="position"
                            name="position"
                        >

                            <option
                                value=""
                                selected
                            >
                                Select Position
                            </option>

                            <option value="President">
                                President
                            </option>

                            <option value="Vice President">
                                Vice President
                            </option>

                            <option value="Secretary">
                                Secretary
                            </option>

                            <option value="Treasurer">
                                Treasurer
                            </option>

                            <option value="Auditor">
                                Auditor
                            </option>

                            <option value="Public Information Officer">
                                Public Information Officer
                            </option>

                            <option value="Business Manager">
                                Business Manager
                            </option>

                            <option value="Representative">
                                Representative
                            </option>

                        </select>


                        <span class="select-arrow">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >

                                <path
                                    d="M6 9l6 6 6-6"
                                />

                            </svg>

                        </span>

                    </div>

                </div>



                <!-- OPTIONS -->

                <div class="options">


                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span class="custom-checkbox"></span>

                        <span>
                            Remember me
                        </span>

                    </label>


                    <button
                        type="button"
                        class="forgot-link"
                        id="forgotPassword"
                    >
                        Forgot password?
                    </button>


                </div>



                <!-- SIGN IN -->

                <button
                    type="submit"
                    class="signin-btn"
                    id="signInButton"
                >

                    <span id="signInText">
                        Sign In
                    </span>

                    <span
                        class="arrow"
                        id="signInArrow"
                    >
                        →
                    </span>

                </button>



                <!-- LOGIN MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>



                <!-- AUTHORIZED -->

                <div class="authorized">

                    <span class="line"></span>

                    <span>
                        Authorized organization members only
                    </span>

                    <span class="line"></span>

                </div>


            </form>

        </section>


    </div>



    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script>


        /* =================================================
           GOOGLE APPS SCRIPT WEB APP URL
        ================================================== */

        const WEB_APP_URL =
            "https://script.google.com/macros/s/AKfycbzTZORNDMsHLxoPeOLNAHurKurC14whoFKxT10RVPyCxP-z9H03slRLTUyhVx7tkyMW/exec";


        /* =================================================
           ELEMENTS
        ================================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const usernameInput =
            document.getElementById(
                "username"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const positionInput =
            document.getElementById(
                "position"
            );


        const togglePassword =
            document.getElementById(
                "togglePassword"
            );


        const eyeIcon =
            document.getElementById(
                "eyeIcon"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        const signInButton =
            document.getElementById(
                "signInButton"
            );


        const signInText =
            document.getElementById(
                "signInText"
            );


        const signInArrow =
            document.getElementById(
                "signInArrow"
            );


        const rememberMe =
            document.getElementById(
                "rememberMe"
            );


        /* =================================================
           PASSWORD VISIBILITY
        ================================================== */

        togglePassword.addEventListener(
            "click",
            function() {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";


                    eyeIcon.innerHTML = `
                        <path d="M3 6l18 12M6 6h12v12H6z"/>
                    `;


                    togglePassword.classList.add(
                        "active"
                    );


                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                }

                else {

                    passwordInput.type =
                        "password";


                    eyeIcon.innerHTML = `
                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
                        <circle cx="12" cy="12" r="2.5"/>
                    `;


                    togglePassword.classList.remove(
                        "active"
                    );


                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );



        /* =================================================
           REMEMBER ME
        ================================================== */

        const savedUsername =
            localStorage.getItem(
                "psabeRememberUsername"
            );


        if (savedUsername) {

            usernameInput.value =
                savedUsername;

            rememberMe.checked =
                true;

        }


        rememberMe.addEventListener(
            "change",
            function() {

                if (
                    !this.checked
                ) {

                    localStorage.removeItem(
                        "psabeRememberUsername"
                    );

                }

            }
        );



        /* =================================================
           LOGIN FORM
        ================================================== */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    usernameInput.value.trim();


                const password =
                    passwordInput.value;


                /*
                   Position is intentionally NOT
                   used for authentication.

                   The correct position is retrieved
                   automatically from the OFFICERS sheet.
                */


                if (
                    !username ||
                    !password
                ) {

                    showMessage(
                        "Please enter your username and password.",
                        "error"
                    );

                    return;

                }


                if (
                    !WEB_APP_URL ||
                    WEB_APP_URL ===
                    "YOUR_WEB_APP_URL"
                ) {

                    showMessage(
                        "The system connection has not been configured yet.",
                        "error"
                    );

                    return;

                }


                setLoading(
                    true
                );


                showMessage(
                    "Signing in...",
                    "success"
                );


                try {


                    const response =
                        await fetch(
                            WEB_APP_URL,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "text/plain;charset=utf-8"

                                },

                                body:
                                    JSON.stringify({

                                        action:
                                            "login",

                                        data: {

                                            username:
                                                username,

                                            password:
                                                password

                                        }

                                    })

                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "Login response:",
                        result
                    );


                    if (
                        result &&
                        result.success
                    ) {


                        /*
                           Save username only if
                           Remember Me is checked.
                        */

                        if (
                            rememberMe.checked
                        ) {

                            localStorage.setItem(
                                "psabeRememberUsername",
                                username
                            );

                        }

                        else {

                            localStorage.removeItem(
                                "psabeRememberUsername"
                            );

                        }


                        /*
                           Store current logged-in
                           officer information.
                        */

                        sessionStorage.setItem(
                            "psabeLoggedIn",
                            "true"
                        );


                        sessionStorage.setItem(
                            "psabeUsername",
                            result.user.username
                        );


                        sessionStorage.setItem(
                            "psabeName",
                            result.user.name
                        );


                        sessionStorage.setItem(
                            "psabePosition",
                            result.user.position
                        );


                        sessionStorage.setItem(
                            "psabeStatus",
                            result.user.status
                        );


                        showMessage(
                            "Login successful. Opening Management System...",
                            "success"
                        );


                        /*
                           Small delay so the
                           success message can
                           appear before redirect.
                        */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "dashboard.html";

                            },
                            500
                        );


                        return;

                    }


                    /*
                       Failed login
                    */

                    showMessage(
                        result &&
                        result.message
                            ? result.message
                            : "Incorrect username or password.",
                        "error"
                    );


                    setLoading(
                        false
                    );

                }

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    showMessage(
                        "Unable to connect to the PSABE-PPG Management System. Please check the system connection.",
                        "error"
                    );


                    setLoading(
                        false
                    );

                }

            }
        );



        /* =================================================
           FORGOT PASSWORD
        ================================================== */

        document
            .getElementById(
                "forgotPassword"
            )
            .addEventListener(
                "click",
                function() {

                    showMessage(
                        "Please contact the PSABE-PPG administrator for account assistance.",
                        "information"
                    );

                }
            );



        /* =================================================
           MESSAGE
        ================================================== */

        function showMessage(
            message,
            type
        ) {

            loginMessage.textContent =
                message;


            loginMessage.className =
                "login-message " +
                type;

        }



        /* =================================================
           LOADING STATE
        ================================================== */

        function setLoading(
            loading
        ) {

            signInButton.disabled =
                loading;


            if (loading) {

                signInText.textContent =
                    "Signing In";


                signInArrow.textContent =
                    "⋯";

            }

            else {

                signInText.textContent =
                    "Sign In";


                signInArrow.textContent =
                    "→";

            }

        }


    </script>


</body>

</html>f
