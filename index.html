<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        PSABE-PPG Management System
    </title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- Roboto Condensed Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Your existing CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         BACKGROUND LOGO
    ====================================================== -->

    <div class="bg-logo"></div>



    <div class="page-wrapper">


        <!-- =================================================
             HEADER / BRANDING
        ================================================== -->

        <header class="branding">


            <img
                src="assets/psabe-ppg-logo.png"
                alt="PSABE-PPG Logo"
                class="header-logo"
            >


            <h1 class="org-name">
                PSABE-PPG
            </h1>


            <h2 class="system-name">
                MANAGEMENT SYSTEM
            </h2>


            <div class="title-line"></div>


            <p class="org-description">

                Philippine Society of Agricultural and Biosystems Engineers<br>

                Pre-Professional Group<br>

                Caraga State University Chapter

            </p>


        </header>



        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <section class="login-card">


            <div class="login-header">

                <h2>
                    Welcome back!
                </h2>

                <p>
                    Sign in to your account to continue<br>
                    to the PSABE-PPG Management System.
                </p>

            </div>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                autocomplete="on"
            >


                <!-- USERNAME -->

                <div class="field">

                    <div class="input-field">


                        <i class="icon user">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <circle
                                    cx="12"
                                    cy="7"
                                    r="4"
                                />

                                <path
                                    d="M4.5 21c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"
                                />

                            </svg>

                        </i>


                        <input
                            type="text"
                            id="username"
                            placeholder="Username or Email"
                            required
                        >


                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="field">

                    <div class="input-field">


                        <i class="icon lock">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="11"
                                    rx="2"
                                />

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3"
                                />

                                <circle
                                    cx="12"
                                    cy="15.5"
                                    r="1"
                                />

                            </svg>

                        </i>


                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <path
                                    d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                />

                            </svg>

                        </button>


                    </div>

                </div>



                <!-- POSITION -->

                <div class="field">

                    <div class="input-field position-box">


                        <i class="icon position">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <circle
                                    cx="9"
                                    cy="8"
                                    r="3"
                                />

                                <path
                                    d="M3.5 20c.5-3.5 2.5-5.5 5.5-5.5s5 2 5.5 5.5"
                                />

                                <circle
                                    cx="17"
                                    cy="9"
                                    r="2.5"
                                />

                                <path
                                    d="M15 14.5c3.5-.2 5.2 1.7 5.5 4.5"
                                />

                            </svg>

                        </i>


                        <select
                            id="position"
                            required
                        >

                            <option
                                value=""
                                disabled
                                selected
                            >
                                Select your position
                            </option>


                            <option value="President">
                                President
                            </option>


                            <option value="Vice President">
                                Vice President
                            </option>


                            <option value="Secretary">
                                Secretary
                            </option>


                            <option value="Treasurer">
                                Treasurer
                            </option>


                            <option value="Auditor">
                                Auditor
                            </option>


                            <option value="PIO">
                                Public Information Officer
                            </option>


                            <option value="Events Head">
                                Events Head
                            </option>


                            <option value="Membership Head">
                                Membership Head
                            </option>


                            <option value="Academic Affairs Head">
                                Academic Affairs Head
                            </option>


                        </select>


                        <span class="select-arrow">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >

                                <path
                                    d="M6 9l6 6 6-6"
                                />

                            </svg>

                        </span>


                    </div>

                </div>



                <!-- OPTIONS -->

                <div class="options">


                    <label class="remember-me">


                        <input
                            type="checkbox"
                            id="rememberMe"
                        >


                        <span class="custom-checkbox"></span>


                        <span>
                            Remember me
                        </span>


                    </label>



                    <button
                        type="button"
                        class="forgot-link"
                        id="forgotPassword"
                    >
                        Forgot password?
                    </button>


                </div>



                <!-- SIGN IN -->

                <button
                    type="submit"
                    class="signin-btn"
                    id="signinButton"
                >

                    <span id="signinText">
                        Sign In
                    </span>

                    <span
                        class="arrow"
                        id="signinArrow"
                    >
                        →
                    </span>

                </button>



                <!-- LOGIN MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>



                <!-- AUTHORIZED -->

                <div class="authorized">

                    <span class="line"></span>

                    <span>
                        Authorized organization members only
                    </span>

                    <span class="line"></span>

                </div>


            </form>


        </section>


    </div>



    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script>


        /* =================================================
           GOOGLE APPS SCRIPT WEB APP URL
        ================================================== */

        const WEB_APP_URL =
            "YOUR_WEB_APP_URL";



        /* =================================================
           PASSWORD TOGGLE
        ================================================== */

        const password =
            document.getElementById(
                "password"
            );


        const togglePassword =
            document.getElementById(
                "togglePassword"
            );


        const eyeIcon =
            document.getElementById(
                "eyeIcon"
            );


        togglePassword.addEventListener(
            "click",
            () => {


                if (
                    password.type ===
                    "password"
                ) {

                    password.type =
                        "text";


                    eyeIcon.innerHTML = `
                        <path d="M3 6l18 12M6 6h12v12H6z"/>
                    `;


                    togglePassword.classList.add(
                        "active"
                    );

                }

                else {

                    password.type =
                        "password";


                    eyeIcon.innerHTML = `
                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
                        <circle cx="12" cy="12" r="2.5"/>
                    `;


                    togglePassword.classList.remove(
                        "active"
                    );

                }


            }
        );



        /* =================================================
           LOGIN FORM
        ================================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        const signinButton =
            document.getElementById(
                "signinButton"
            );


        const signinText =
            document.getElementById(
                "signinText"
            );


        const signinArrow =
            document.getElementById(
                "signinArrow"
            );



        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById(
                            "username"
                        )
                        .value
                        .trim();


                const passwordValue =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                const position =
                    document
                        .getElementById(
                            "position"
                        )
                        .value;


                /* -----------------------------------------
                   BASIC VALIDATION
                ----------------------------------------- */

                if (
                    !username ||
                    !passwordValue ||
                    !position
                ) {

                    showMessage(
                        "Please complete all required fields.",
                        "error"
                    );

                    return;

                }



                /* -----------------------------------------
                   CHECK WEB APP URL
                ----------------------------------------- */

                if (
                    WEB_APP_URL ===
                    "YOUR_WEB_APP_URL"
                ) {

                    showMessage(
                        "The system connection has not been configured yet.",
                        "error"
                    );

                    return;

                }



                /* -----------------------------------------
                   LOADING
                ----------------------------------------- */

                signinButton.disabled =
                    true;


                signinText.textContent =
                    "Signing In";


                signinArrow.textContent =
                    "⋯";


                showMessage(
                    "Connecting to the PSABE-PPG system...",
                    "success"
                );



                try {


                    /* -------------------------------------
                       SEND LOGIN REQUEST
                    ------------------------------------- */

                    const response =
                        await fetch(
                            WEB_APP_URL,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "text/plain;charset=utf-8"

                                },

                                body:
                                    JSON.stringify({

                                        action:
                                            "login",

                                        data: {

                                            username:
                                                username,

                                            password:
                                                passwordValue

                                        }

                                    })

                            }
                        );



                    /* -------------------------------------
                       READ RESPONSE
                    ------------------------------------- */

                    const result =
                        await response.json();



                    console.log(
                        "PSABE login response:",
                        result
                    );



                    /* -------------------------------------
                       SUCCESSFUL LOGIN
                    ------------------------------------- */

                    if (
                        result &&
                        result.success
                    ) {


                        /*
                           Save the authenticated
                           officer information.
                        */

                        sessionStorage.setItem(
                            "psabeLoggedIn",
                            "true"
                        );


                        sessionStorage.setItem(
                            "psabeUsername",
                            result.user.username
                        );


                        sessionStorage.setItem(
                            "psabeName",
                            result.user.name
                        );


                        sessionStorage.setItem(
                            "psabePosition",
                            result.user.position
                        );


                        sessionStorage.setItem(
                            "psabeStatus",
                            result.user.status
                        );



                        /*
                           Remember username only.
                           The password is NOT saved.
                        */

                        const rememberMe =
                            document.getElementById(
                                "rememberMe"
                            );


                        if (
                            rememberMe.checked
                        ) {

                            localStorage.setItem(
                                "psabeRememberUsername",
                                username
                            );

                        }

                        else {

                            localStorage.removeItem(
                                "psabeRememberUsername"
                            );

                        }



                        showMessage(
                            "Login successful.",
                            "success"
                        );



                        /*
                           Open dashboard.
                        */

                        setTimeout(
                            () => {

                                window.location.href =
                                    "dashboard.html";

                            },
                            500
                        );


                        return;

                    }



                    /* -------------------------------------
                       FAILED LOGIN
                    ------------------------------------- */

                    showMessage(
                        result &&
                        result.message
                            ? result.message
                            : "Incorrect username or password.",
                        "error"
                    );


                    resetSignInButton();


                }

                catch (error) {


                    console.error(
                        "Login error:",
                        error
                    );


                    showMessage(
                        "Unable to connect to the PSABE-PPG Management System.",
                        "error"
                    );


                    resetSignInButton();

                }


            }
        );



        /* =================================================
           FORGOT PASSWORD
        ================================================== */

        document
            .getElementById(
                "forgotPassword"
            )
            .addEventListener(
                "click",
                function() {

                    showMessage(
                        "Please contact the PSABE-PPG administrator for account assistance.",
                        "information"
                    );

                }
            );



        /* =================================================
           REMEMBERED USERNAME
        ================================================== */

        const rememberedUsername =
            localStorage.getItem(
                "psabeRememberUsername"
            );


        if (
            rememberedUsername
        ) {

            document
                .getElementById(
                    "username"
                )
                .value =
                rememberedUsername;


            document
                .getElementById(
                    "rememberMe"
                )
                .checked =
                true;

        }



        /* =================================================
           MESSAGE FUNCTION
        ================================================== */

        function showMessage(
            message,
            type
        ) {

            loginMessage.textContent =
                message;


            loginMessage.className =
                "login-message " +
                type;

        }



        /* =================================================
           RESET SIGN IN BUTTON
        ================================================== */

        function resetSignInButton() {

            signinButton.disabled =
                false;


            signinText.textContent =
                "Sign In";


            signinArrow.textContent =
                "→";

        }


    </script>


</body>

</html>
